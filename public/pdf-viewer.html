<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aether PDF Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #viewer-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0;
    }
    .page-container {
      position: relative;
      margin: 0 auto;
      background-color: #050505;
    }
    canvas {
      display: block;
    }
    .textLayer {
      mix-blend-mode: multiply;
      opacity: 0.99;
      z-index: 2;
    }
    /* selection styling */
    .textLayer ::selection {
      background: rgba(168, 85, 247, 0.35) !important;
      color: transparent !important;
    }
    .textLayer span {
      color: transparent !important;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
      text-transform: uppercase;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="loading">LOADING REFERENCE...</div>
  <div id="viewer-container"></div>

  <script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file');
    let currentPage = parseInt(params.get('page')) || 1;
    const pdfId = params.get('pdfId');

    let pdfDoc = null;
    let renderTask = null;
    let resizeTimeout = null;
    let pageHighlights = [];

    if (!fileUrl) {
      document.getElementById('loading').textContent = 'NO PDF SPECIFIED';
    } else {
      loadDocument();
    }

    async function loadDocument() {
      try {
        pdfDoc = await pdfjsLib.getDocument(fileUrl).promise;
        document.getElementById('loading').style.display = 'none';
        
        // Notify parent about document load and details
        if (window.parent) {
          window.parent.postMessage({
            type: 'PDF_LOADED',
            pdfId: pdfId,
            numPages: pdfDoc.numPages
          }, '*');
        }
        
        renderPage(currentPage);
      } catch (err) {
        console.error('Failed to load PDF:', err);
        document.getElementById('loading').textContent = 'ERROR LOADING PDF: ' + err.message;
      }
    }

    async function renderPage(num) {
      if (!pdfDoc) return;
      const container = document.getElementById('viewer-container');
      container.innerHTML = ''; // clear

      if (renderTask) {
        renderTask.cancel();
      }

      try {
        const page = await pdfDoc.getPage(num);
        
        // We want the page to fit the viewport width
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const displayWidth = window.innerWidth;
        const scaleFactor = displayWidth / unscaledViewport.width;
        const viewport = page.getViewport({ scale: scaleFactor });

        // Calculate device pixel ratio and render headroom for super-crisp canvas zooms
        const dpr = window.devicePixelRatio || 1;
        const renderViewport = page.getViewport({ scale: scaleFactor * dpr * 1.5 });

        // Create page elements wrapper
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-container';
        pageDiv.style.width = viewport.width + 'px';
        pageDiv.style.height = viewport.height + 'px';
        container.appendChild(pageDiv);

        // Create canvas
        const canvas = document.createElement('canvas');
        canvas.width = renderViewport.width;
        canvas.height = renderViewport.height;
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';
        pageDiv.appendChild(canvas);

        // Create text layer
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        textLayerDiv.style.width = viewport.width + 'px';
        textLayerDiv.style.height = viewport.height + 'px';
        textLayerDiv.style.setProperty('--scale-factor', viewport.scale);
        pageDiv.appendChild(textLayerDiv);

        const context = canvas.getContext('2d');
        const renderContext = {
          canvasContext: context,
          viewport: renderViewport
        };

        renderTask = page.render(renderContext);
        await renderTask.promise;

        // Render text layer
        const textContent = await page.getTextContent();
        if (pdfjsLib.TextLayer) {
          const textLayerObj = new pdfjsLib.TextLayer({
            container: textLayerDiv,
            textContentSource: textContent,
            viewport: viewport
          });
          await textLayerObj.render();
        } else {
          await pdfjsLib.renderTextLayer({
            textContent: textContent,
            container: textLayerDiv,
            viewport: viewport,
            textDivs: []
          }).promise;
        }

        // Load highlights for this page
        setTimeout(loadHighlights, 50);

      } catch (err) {
        if (err.name !== 'RenderingCancelledException') {
          console.error('Page render error:', err);
        }
      }
    }

    // Helper to traverse text nodes to find character offset
    function getTextNodeAtOffset(container, offset) {
      let charCount = 0;
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while (node = walker.nextNode()) {
        const length = node.textContent.length;
        if (charCount + length >= offset) {
          return { node: node, offset: offset - charCount };
        }
        charCount += length;
      }
      return null;
    }

    // Helper to compute character selection offsets
    function getSelectionOffsets(container) {
      if (!container) return null;
      const selection = window.getSelection();
      if (selection.rangeCount === 0) return null;
      
      const range = selection.getRangeAt(0);
      if (!container.contains(range.startContainer) || !container.contains(range.endContainer)) {
        return null;
      }
      
      const preSelectionRange = range.cloneRange();
      preSelectionRange.selectNodeContents(container);
      preSelectionRange.setEnd(range.startContainer, range.startOffset);
      const start = preSelectionRange.toString().length;
      
      return {
        start: start,
        end: start + range.toString().length,
        text: range.toString()
      };
    }

    // Load PDF highlights from database
    async function loadHighlights() {
      if (!pdfId) return;
      try {
        const res = await fetch('/api/pdfs/highlights?pdf_id=' + pdfId);
        if (!res.ok) throw new Error('API error');
        const allHighlights = await res.json();
        pageHighlights = allHighlights.filter(h => h.page_number === currentPage);
        renderHighlights();
      } catch (err) {
        console.error('Failed to load highlights:', err);
      }
    }

    // Delete existing highlights overlapping a selection range
    async function deleteOverlappingHighlights(start, end) {
      const overlaps = pageHighlights.filter(h => {
        return !(h.end_offset <= start || h.start_offset >= end);
      });
      
      await Promise.all(overlaps.map(h => 
        fetch('/api/pdfs/highlights?id=' + h.id, { method: 'DELETE' })
      ));
    }

    // Render highlights in absolute layer positioned below textLayer
    function renderHighlights() {
      const pageDiv = document.querySelector('.page-container');
      if (!pageDiv) return;
      
      let highlightLayer = document.getElementById('highlight-layer');
      if (highlightLayer) {
        highlightLayer.innerHTML = '';
      } else {
        highlightLayer = document.createElement('div');
        highlightLayer.id = 'highlight-layer';
        highlightLayer.style.position = 'absolute';
        highlightLayer.style.top = '0';
        highlightLayer.style.left = '0';
        highlightLayer.style.width = '100%';
        highlightLayer.style.height = '100%';
        highlightLayer.style.pointerEvents = 'none';
        highlightLayer.style.zIndex = '1';
        pageDiv.appendChild(highlightLayer);
      }
      
      const textLayerDiv = document.querySelector('.textLayer');
      if (!textLayerDiv) return;
      
      const containerRect = textLayerDiv.getBoundingClientRect();
      
      pageHighlights.forEach(h => {
        const startPos = getTextNodeAtOffset(textLayerDiv, h.start_offset);
        const endPos = getTextNodeAtOffset(textLayerDiv, h.end_offset);
        
        if (startPos && endPos) {
          try {
            const range = document.createRange();
            range.setStart(startPos.node, startPos.offset);
            range.setEnd(endPos.node, endPos.offset);
            
            const rects = range.getClientRects();
            
            for (const rect of rects) {
              const mark = document.createElement('div');
              mark.style.position = 'absolute';
              mark.style.left = (rect.left - containerRect.left) + 'px';
              mark.style.top = (rect.top - containerRect.top) + 'px';
              mark.style.width = rect.width + 'px';
              mark.style.height = rect.height + 'px';
              mark.style.mixBlendMode = 'multiply';
              mark.style.pointerEvents = 'none';
              
              if (h.color === 'purple') {
                mark.style.backgroundColor = 'rgba(168, 85, 247, 0.4)';
              } else if (h.color === 'cyan') {
                mark.style.backgroundColor = 'rgba(0, 170, 255, 0.4)';
              } else if (h.color === 'green') {
                mark.style.backgroundColor = 'rgba(34, 197, 94, 0.4)';
              }
              
              highlightLayer.appendChild(mark);
            }
          } catch (e) {
            console.error('Failed to draw selection range highlight:', e);
          }
        }
      });
    }

    // Handle incoming messages for page changes or resizing
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'PAGE_CHANGE') {
        currentPage = e.data.page;
        renderPage(currentPage);
      } else if (e.data && e.data.type === 'RESIZE') {
        // Debounce resize events to keep rendering fast and smooth
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          if (pdfDoc) {
            renderPage(currentPage);
          }
        }, 150);
      } else if (e.data && e.data.type === 'RELOAD_HIGHLIGHTS') {
        loadHighlights();
      }
    });

    // Capture text dragging and set metadata
    document.addEventListener('dragstart', (e) => {
      const selection = window.getSelection().toString();
      if (selection && selection.trim()) {
        e.dataTransfer.setData('text/plain', selection.trim());
        if (pdfId) {
          e.dataTransfer.setData('application/x-pdf-source-id', pdfId);
          e.dataTransfer.effectAllowed = 'copy';
        }
      }
    });

    // Keyboard shortcuts for highlights inside iframe
    document.addEventListener('keydown', async (e) => {
      const key = e.key;
      let colorName = '';
      if (key === '1') colorName = 'purple';
      else if (key === '2') colorName = 'cyan';
      else if (key === '3') colorName = 'green';
      
      const textLayerDiv = document.querySelector('.textLayer');
      if (!textLayerDiv) return;

      if (colorName) {
        const offsets = getSelectionOffsets(textLayerDiv);
        if (offsets && offsets.end > offsets.start) {
          e.preventDefault();
          
          // Clear any overlapping highlights first
          await deleteOverlappingHighlights(offsets.start, offsets.end);
          
          try {
            await fetch('/api/pdfs/highlights', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                pdf_id: pdfId,
                page_number: currentPage,
                start_offset: offsets.start,
                end_offset: offsets.end,
                text: offsets.text,
                color: colorName
              })
            });
            window.getSelection().removeAllRanges();
            await loadHighlights();
            if (window.parent) {
              window.parent.postMessage({
                type: 'HIGHLIGHT_MUTATED',
                pdfId: pdfId
              }, '*');
            }
          } catch (err) {
            console.error('Failed to save highlight:', err);
          }
        }
      } else if (key === '0' || key === 'Backspace' || key === 'Delete') {
        const offsets = getSelectionOffsets(textLayerDiv);
        if (offsets) {
          e.preventDefault();
          await deleteOverlappingHighlights(offsets.start, offsets.end);
          window.getSelection().removeAllRanges();
          await loadHighlights();
          if (window.parent) {
            window.parent.postMessage({
              type: 'HIGHLIGHT_MUTATED',
              pdfId: pdfId
            }, '*');
          }
        }
      }
    });

    // Send focus message to parent window on pointerdown
    document.addEventListener('pointerdown', () => {
      if (window.parent) {
        window.parent.postMessage({
          type: 'PDF_INTERACT',
          pdfId: pdfId
        }, '*');
      }
    });
  </script>
</body>
</html>
